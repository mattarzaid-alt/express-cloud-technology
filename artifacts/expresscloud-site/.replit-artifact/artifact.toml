kind = "web"
previewPath = "/"
title = "ExpressCloud AI"
version = "1.0.0"
id = "artifacts/expresscloud-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24116

[services.development]
run = "pnpm --filter @workspace/expresscloud-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/expresscloud-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/expresscloud-site/dist/public"

[services.env]
PORT = "24116"
BASE_PATH = "/"
